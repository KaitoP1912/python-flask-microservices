{% extends "base_col_1.html" %}
{% block title %}Edit Product{% endblock %}

{% block pageContent %}
    <h1>Edit Product</h1>

    <form method="POST">
        <div class="form-group">
            <label>Name</label>
            <input class="form-control" type="text" name="name" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label>Slug</label>
            <input class="form-control" type="text" name="slug" value="{{ product.slug }}" required>
        </div>
        <div class="form-group">
            <label>Image filename</label>
            <input class="form-control" type="text" name="image" value="{{ product.image }}">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input class="form-control" type="number" name="price" value="{{ product.price }}" required>
        </div>

        <button class="btn btn-success" type="submit">Save</button>
        <a href="/admin" class="btn btn-default">Cancel</a>
    </form>
{% endblock %}
